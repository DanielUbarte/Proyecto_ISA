name: panama_historica
description: "Panamá Histórica - App Educativa de Historia con AR e Historiador IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2
  flutter_tts: ^4.2.0
  syncfusion_flutter_pdf: ^35.1.41
  http: ^1.2.0
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/modules/contemporanea/documents/
    - assets/modules/contemporanea/images/
    - assets/modules/contemporanea/images/martires-panama.jpg
    - assets/modules/contemporanea/images/martires-panama-2.jpg
    - assets/modules/contemporanea/images/martires.jfif

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
